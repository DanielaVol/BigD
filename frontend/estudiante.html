<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JUNTOS - Vista Estudiante</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            background-color: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 100%;
            text-align: center;
        }
        h1 { color: #0f3057; }
        .logout-btn {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #d9534f;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
        }
        .logout-btn:hover { background-color: #c9302c; }
    </style>
</head>
<body>
    <div class="container">
        <h1>¡Hola, <span id="user-name">Estudiante</span>!</h1>
        <p>Bienvenido/a a tu panel de práctica de Probabilidad y Estadística.</p>
        <p><em>(Esta es una vista placeholder de la demo)</em></p>
        <button id="logout-btn" class="logout-btn">Cerrar sesión</button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Verificar sesión
            const role = localStorage.getItem('juntos_user_role');
            const name = localStorage.getItem('juntos_user_name');

            if (role !== 'estudiante') {
                window.location.href = 'index.html'; // Redirigir si no está autorizado
                return;
            }

            if (name) {
                document.getElementById('user-name').textContent = name;
            }

            // Lógica de logout
            document.getElementById('logout-btn').addEventListener('click', () => {
                localStorage.clear();
                window.location.href = 'index.html';
            });
        });
    </script>
</body>
</html>
