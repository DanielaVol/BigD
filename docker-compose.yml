services:
  backend:
    build: ./backend
    container_name: juntos-backend
    env_file:
      - ./backend/.env
    environment:
      - MATERIAL_ROOT=/code/material_demo/distribuciones_discretas
    ports:
      - "8001:8000"
    volumes:
      - ./backend/app:/code/app
      - ./material_demo/distribuciones_discretas:/code/material_demo/distribuciones_discretas:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    image: nginx:alpine
    container_name: juntos-frontend
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend